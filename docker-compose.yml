# Evaluate or run Presswork cleanly without colliding with a host CUPS daemon.
# Binds host loopback 127.0.0.1:8631 -> container 631 with least-privilege
# non-root execution, persistent config/spool volumes, and healthchecks.
#
# Quickstart:
#   docker compose up --build -d
#   lpstat -h 127.0.0.1:8631 -t
services:
  cupsd:
    image: ${PRESSWORK_IMAGE:-ghcr.io/vindeckyy/presswork:0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_CUPS_FILTERS: ${INSTALL_CUPS_FILTERS:-false}
    restart: unless-stopped
    user: "631:631"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 631
    ports:
      - "127.0.0.1:8631:631"
    volumes:
      - cups-etc:/etc/cups
      - cups-spool:/var/spool/cups
      - cups-log:/var/log/cups
      - cups-cache:/var/cache/cups
    tmpfs:
      - /run/cups:uid=631,gid=631,mode=0755
      - /tmp:uid=631,gid=631,mode=1777
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >
          exec 3<>/dev/tcp/127.0.0.1/631 &&
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          IFS= read -r status <&3 &&
          case "$status" in *' 200 '*|*' 404 '*) exit 0 ;; *) exit 1 ;; esac
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  cups-etc:
  cups-spool:
  cups-log:
  cups-cache:
