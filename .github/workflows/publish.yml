name: publish crates

# Publishes the crates.io-facing library crates in dependency order.
# Invoked automatically by release.yml via workflow_call (avoiding GitHub's
# GITHUB_TOKEN event suppression on `release: [published]`) and manually via
# workflow_dispatch (with an optional dry-run mode).
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git tag or ref to publish'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Run cargo publish --dry-run without uploading'
        required: false
        type: boolean
        default: false
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag or ref to publish (defaults to current ref)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Run cargo publish --dry-run without uploading to crates.io'
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    name: cargo publish (dependency order)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: verify license files present before packaging
        run: |
          set -euo pipefail
          for f in LICENSE-APACHE LICENSE-MIT NOTICE; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty; refusing to publish crates" >&2
              exit 1
            fi
          done

      - name: publish crates in dependency order
        run: |
          set -euo pipefail
          # Leaves first; crates that depend on published crates last.
          CRATES=(ipp-codec yindle-sys backend-common cups-tls cups-log cups-config)

          if [ "$DRY_RUN" = "true" ]; then
            for c in "${CRATES[@]}"; do
              echo "=== Dry-run packaging check: $c ==="
              cargo package -p "$c" --locked --no-verify
            done
            echo "Dry-run completed cleanly."
            exit 0
          fi

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not configured; skipping crates.io publish."
            exit 0
          fi

          # Cargo automatically reads CARGO_REGISTRY_TOKEN from the environment
          # (avoid passing tokens on CLI argv).
          for c in "${CRATES[@]}"; do
            echo "=== Publishing $c ==="
            for attempt in 1 2 3 4 5; do
              if out=$(cargo publish -p "$c" --locked 2>&1); then
                printf '%s\n' "$out" | tail -n 3
                break
              fi
              printf '%s\n' "$out" | tail -n 10
              case "$out" in
                *"already uploaded"*|*"already exists"*)
                  echo "$c already published at this version; skipping."
                  break
                  ;;
                *"no matching package"*|*"failed to select a version"*)
                  if [ "$attempt" -eq 5 ]; then
                    echo "ERROR: dependency index did not propagate in time for $c" >&2
                    exit 1
                  fi
                  echo "Dependency index not ready; retrying in 30s (attempt $attempt/5)..."
                  sleep 30
                  ;;
                *)
                  exit 1
                  ;;
              esac
            done
          done
