[package]
name = "cupsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
authn = { path = "../../crates/authn" }
authz = { path = "../../crates/authz" }
cups-config = { path = "../../crates/cups-config" }
cups-dbus = { path = "../../crates/cups-dbus" }
cups-log = { path = "../../crates/cups-log" }
cups-tls = { path = "../../crates/cups-tls" }
dnssd = { path = "../../crates/dnssd" }
events = { path = "../../crates/events" }
httpd = { path = "../../crates/httpd" }
ipp-codec = { path = "../../crates/ipp-codec" }
job = { path = "../../crates/job" }
libc = "0.2"
mime-db = { path = "../../crates/mime-db" }
ops = { path = "../../crates/ops" }
pipeline = { path = "../../crates/pipeline" }
printer = { path = "../../crates/printer" }
sys = { path = "../../crates/sys", package = "presswork-sys" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "signal", "fs", "io-util", "time", "sync", "process"] }
tokio-rustls = "0.26.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
