# cargo-deny config — supply-chain gates run in CI.
# `cargo deny check` fails the build on advisories, license drift, banned
# crates, or unvetted dependency sources.

[advisories]
# Known-vulnerable dependency versions always fail (implicit in cargo-deny 0.20).
# Enforce unmaintained, unsound, and yanked checks across the full dependency graph.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Workspace licenses; dependencies must satisfy this SPDX allowlist.
# Third-party license attribution details are documented in NOTICE.
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
private = { ignore = true }

[bans]
# Warn on duplicate major versions so bloat/drift stays visible.
multiple-versions = "warn"
highlight = "all"
# Allow internal path dependencies without explicit versions once unpublished
# workspace crates carry `publish = false`. Because internal workspace crates
# currently omit `publish = false`, cargo-deny treats their relative `path`
# deps as public-crate wildcards; keep `wildcards = "warn"` here so
# `cargo deny check` succeeds while CI's supply-chain job strictly rejects any
# external `*` wildcard version requirement via `cargo metadata`. Flip to
# `wildcards = "deny"` once unpublished internal Cargo.toml manifests set
# `publish = false`.
wildcards = "warn"
allow-wildcard-paths = true
deny = []
skip = []

[sources]
# Only crates.io; no git/path-only external deps in the release graph.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
